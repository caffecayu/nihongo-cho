<title>毎日にほんご帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: a single phone column like a 原稿用紙 notebook; bottom tab bar; gauge + one big button on home */
:root{
  --bg:#f3f6f2; --paper:#fbfdfa; --ink:#23302a; --muted:#66756d; --line:#d5e2d8; --grid:#b9d3c1;
  --accent:#2f7a55; --accent-ink:#ffffff; --needle:#d9572b; --ok:#2f7a55; --bad:#c2412d; --warn:#b7791f; --hanko:#c8372d;
  --soft:#e6efe8; --blue:#3a6ea5;
  --f-disp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","PingFang SC","Microsoft YaHei",sans-serif;
  --f-hand:"Klee One","Zen Maru Gothic",serif;
  --f-body:system-ui,-apple-system,"PingFang SC","Hiragino Sans","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a17; --paper:#1b231f; --ink:#e4ece6; --muted:#9aaba1; --line:#2c3a33; --grid:#35513f;
  --accent:#5cbf8a; --accent-ink:#0f1a14; --needle:#f07a4e; --ok:#5cbf8a; --bad:#f07a63; --warn:#e0a84a; --hanko:#e5544a; --soft:#22302a; --blue:#7fa8de; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a17; --paper:#1b231f; --ink:#e4ece6; --muted:#9aaba1; --line:#2c3a33; --grid:#35513f;
  --accent:#5cbf8a; --accent-ink:#0f1a14; --needle:#f07a4e; --ok:#5cbf8a; --bad:#f07a63; --warn:#e0a84a; --hanko:#e5544a; --soft:#22302a; --blue:#7fa8de; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 96px}
h1,h2,h3{font-family:var(--f-body);font-weight:800;margin:0;text-wrap:balance}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:4px 2px 8px}
.top h1{font-size:20px;font-weight:900;letter-spacing:.02em}
.top .date{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn:focus-visible,.big:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--needle);outline-offset:2px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.big{appearance:none;border:0;width:100%;padding:18px;border-radius:18px;background:var(--accent);color:var(--accent-ink);
  font-family:var(--f-body);font-size:20px;font-weight:800;letter-spacing:.1em;cursor:pointer;box-shadow:0 6px 0 color-mix(in srgb,var(--accent) 60%,black)}
.big:active{transform:translateY(3px);box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,black)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;background:var(--soft);font-size:12.5px;font-weight:600}
.chip.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.chip.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
/* gauge */
.gauge{position:relative;padding:10px 0 0}
.gauge svg{width:100%;height:auto;display:block}
.gauge .read{text-align:center;margin-top:4px}
.gauge .pct{font-family:var(--f-disp);font-size:40px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.gauge .sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.needle{transition:transform 1.1s cubic-bezier(.3,1.4,.5,1);transform-origin:120px 128px}
@media (prefers-reduced-motion:reduce){.needle{transition:none}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-family:var(--f-disp);font-size:22px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.lesson{font-size:13.5px}
.lesson b{font-weight:800}
/* study */
.prog{height:8px;border-radius:9px;background:var(--soft);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .4s}
.word{font-family:var(--f-disp);font-size:40px;font-weight:900;text-align:center;line-height:1.2;word-break:keep-all}
.reading{text-align:center;color:var(--muted);font-size:17px}
/* reading + small speaker; header gear + pronunciation popover */
.say-line{display:flex;align-items:center;justify-content:center;gap:8px}
.say-line .reading{font-size:20px}
.spk{appearance:none;border:1px solid var(--line);background:var(--paper);color:var(--accent);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0;flex:none}
.spk svg{width:19px;height:19px}
.spk:hover{background:var(--soft)} .spk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.spk .w1,.spk .w2{opacity:.35}
.spk.playing{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.spk.playing .w1{animation:wave 1s infinite} .spk.playing .w2{animation:wave 1s .25s infinite}
@keyframes wave{50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.spk.playing .w1,.spk.playing .w2{animation:none;opacity:1}}
.src a{color:var(--muted);margin-left:8px}
.top-r{display:flex;align-items:center;gap:10px;position:relative}
.gear{appearance:none;border:1px solid var(--line);background:var(--paper);color:var(--muted);width:34px;height:34px;border-radius:10px;display:grid;place-items:center;cursor:pointer;padding:0}
.gear svg{width:18px;height:18px} .gear:hover,.gear[aria-expanded="true"]{color:var(--accent);background:var(--soft)}
.pop{box-sizing:border-box;position:absolute;right:0;top:calc(100% + 8px);z-index:30;width:min(300px,calc(100vw - 32px));background:var(--paper);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 12px 32px rgba(0,0,0,.14);padding:14px;max-height:calc(100vh - 110px);overflow:auto;display:flex;flex-direction:column;gap:12px;text-align:left}
.pop h3{font-size:14px;margin:0;color:var(--muted);font-weight:700}
.pop .opt{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px}
.pop .opt small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.pop select{width:100%;font:inherit;font-size:14px;padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.pop label.l{font-size:13px;color:var(--muted);margin-bottom:-6px}
.sw{appearance:none;width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;cursor:pointer;flex:none;margin:0;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw:checked{background:var(--accent)} .sw:checked::after{transform:translateX(18px)}
.sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.meaning{text-align:center;font-size:20px;font-weight:700}
.src{text-align:center;font-size:12px;color:var(--muted)}
.ans{width:100%;box-sizing:border-box;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:20px;background:var(--bg);color:var(--ink);text-align:center}
.ans.sent{text-align:left;font-size:17px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{appearance:none;border:0;background:transparent;color:var(--muted);padding:6px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.diff{font-size:22px;text-align:center;letter-spacing:.06em;font-family:var(--f-disp)}
.diff.sent{font-size:17px;text-align:left;letter-spacing:0}
.diff .x{color:var(--bad);text-decoration:line-through}
.diff .m{color:var(--bad);border-bottom:2px dashed var(--bad)}
.diff .o{color:var(--ok)}
.verdict{text-align:center;font-weight:800;font-size:20px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
/* 5-word group: phase dots + end-of-group checklist */
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--soft);border:1px solid var(--line)}
.dots i.on{background:var(--accent);border-color:var(--accent)} .dots i.cur{outline:2px solid var(--accent);outline-offset:2px}
.ticks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;text-align:left}
.tick-row{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--soft);
  opacity:0;transform:translateY(6px);animation:rowIn .3s ease forwards;animation-delay:calc(var(--d)*.45s)}
.tick-box{width:30px;height:30px}
.tick-box rect{fill:var(--paper);stroke:var(--muted);stroke-width:2}
.tick-box .mk{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:32;stroke-dashoffset:32;
  animation:draw .35s ease-out forwards;animation-delay:calc(var(--d)*.45s + .25s)}
.tick-row.ok .mk{stroke:var(--ok)} .tick-row.bad .mk{stroke:var(--bad)}
.tick-row .tw{display:flex;flex-direction:column;gap:2px;min-width:0}
.tick-row .tw b{font-family:var(--f-disp);font-size:19px;align-self:flex-start}
.tick-row .tw b{position:relative}
.tick-row.ok .tw b::after{content:"";position:absolute;left:-2px;right:-2px;top:52%;height:2px;border-radius:2px;background:var(--ok);transform:scaleX(0);transform-origin:left;
  animation:strike .3s ease-out forwards;animation-delay:calc(var(--d)*.45s + .5s)}
.tick-row .tw span{font-size:13px;color:var(--muted)}
.tick-row .tw .diff{font-size:15px;margin-top:2px;text-align:left;justify-content:flex-start}
.done-head{position:relative;display:flex;flex-direction:column;gap:6px;align-items:center}
.stamp{position:absolute;right:4px;top:-6px;width:58px;height:58px;display:grid;place-items:center;border:3px solid var(--hanko);border-radius:50%;
  color:var(--hanko);font-family:var(--f-disp);font-weight:900;font-size:26px;opacity:0;transform:scale(2) rotate(-20deg);
  animation:stamp .4s cubic-bezier(.3,1.4,.6,1) forwards;animation-delay:calc(var(--n)*.45s + .5s)}
@keyframes rowIn{to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes strike{to{transform:scaleX(1)}}
@keyframes stamp{to{opacity:1;transform:scale(1) rotate(-10deg)}}
.noanim .tick-row,.noanim .tick-box .mk,.noanim .stamp,.noanim .tick-row.ok .tw b::after{animation-duration:0s!important;animation-delay:0s!important}
@media (prefers-reduced-motion:reduce){.tick-row,.tick-box .mk,.stamp,.tick-row.ok .tw b::after{animation-duration:0s!important;animation-delay:0s!important}}
.padwrap{display:flex;justify-content:center}
canvas.pad{cursor:crosshair}
canvas.pad.on{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 20%,transparent)}
.hw-box{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:10px;border:2px dashed var(--line);border-radius:14px;cursor:text;background:var(--paper)}
.hw-box:hover,.hw-box:focus-visible{border-color:var(--accent);outline:none}
.hw-box.on{border-style:solid;border-color:var(--accent)}
.hw-slot{display:grid;place-items:center;width:58px;height:58px;border-radius:10px;border:1px solid var(--line);font-size:34px;line-height:1;color:var(--ink);background:var(--paper)}
.hw-slot.cur{border:2px solid var(--accent);background:var(--soft);animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{border-color:transparent}}
.hw-hint{font-size:13px;text-align:center;color:var(--muted,#888);line-height:1.7;padding:6px 10px;border-radius:10px}
.hw-hint.on{color:var(--accent);background:var(--soft)}
.hw-hint kbd{font:inherit;font-size:12px;padding:0 6px;border:1px solid currentColor;border-radius:5px}
@media (prefers-reduced-motion:reduce){.hw-slot.cur{animation:none}}
.choices{display:grid;grid-template-columns:1fr;gap:8px;width:100%}
@media (min-width:600px){.choices{grid-template-columns:1fr 1fr}}
.choice{appearance:none;display:flex;gap:10px;align-items:center;text-align:left;width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:16px;cursor:pointer}
.choice b{display:grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--soft);color:var(--accent);font-size:13px;flex:none}
.choice:hover{border-color:var(--accent);background:var(--soft)} .choice.was{border-style:dashed;border-color:var(--accent)} .choice:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0}
.tag{font-size:12px;padding:1px 8px;border-radius:999px}
.tag.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)} .tag.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}

canvas.pad{touch-action:none;background:var(--paper);border:2px solid var(--grid);border-radius:10px;max-width:100%}
/* phrases */
.scene{display:flex;flex-direction:column;gap:6px}
.scene h3{font-size:15px;display:flex;justify-content:space-between;align-items:center}
.pl{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px dashed var(--line)}
.pl .jp{font-family:var(--f-disp);font-weight:700}
.pl .zh{font-size:13px;color:var(--muted)}
details summary{cursor:pointer;font-weight:700}
.gram{margin-top:8px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--bad,#c55) 7%,transparent);display:flex;flex-direction:column;gap:6px}
.gram ul{margin:0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:3px}.gram s{opacity:.7}
textarea.grow{resize:none;overflow-y:auto;line-height:1.6;min-height:42px;max-height:50vh;font-size:16px}
input.f,select.f,textarea.f{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;background:var(--bg);color:var(--ink)}
label.l{font-size:12.5px;color:var(--muted);display:block;margin:8px 0 4px}
/* me */
.hero-msg{font-size:18px;line-height:1.65;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{font-size:11px;color:var(--muted);text-align:center}
.cal .d{aspect-ratio:1;max-width:100%;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;position:relative}
.cal .d.s{background:color-mix(in srgb,var(--accent) 30%,var(--soft));color:var(--ink)}
.cal .d.g{background:transparent;border:2px solid var(--hanko);color:var(--hanko);font-family:var(--f-disp);font-weight:900;font-size:13px;border-radius:50%}
.cal .d.t{outline:2px solid var(--ink);outline-offset:1px}
.cal .d.f{opacity:.35}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.list{max-height:420px;overflow:auto;border-top:1px solid var(--line)}
.li{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 2px;border-bottom:1px solid var(--line)}
.li .w{font-family:var(--f-disp);font-weight:700;min-width:0}
.li .r{font-size:12.5px;color:var(--muted);min-width:0}
.li .z{grid-column:1/-1;font-size:13px}
.lvl{font-size:11px;font-weight:700;color:var(--muted)}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:center;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
.tabs .in{display:flex;max-width:480px;width:100%}
.tab{flex:1;appearance:none;border:0;background:transparent;color:var(--muted);padding:10px 0 12px;font-weight:700;font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab .k{font-family:var(--f-disp);font-size:20px;font-weight:900;line-height:1}
.tab[aria-selected="true"]{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13.5px;z-index:9;max-width:86vw;text-align:center}
.save{font-size:11.5px;color:var(--muted)}
.side-brand,.side-context,.side-foot{display:none}
.phrase-actions{display:flex;flex-direction:column;gap:10px}
/* Desktop workspace: navigation and categories on the left, content on the right. */
@media (min-width:900px){
  :root{--side-width:284px}
  body{margin:0}
  .app{box-sizing:border-box;max-width:none;margin:0 0 0 var(--side-width);min-height:100vh;padding:32px 42px 48px}
  .view,.top{box-sizing:border-box;width:100%;max-width:1080px;margin-left:auto;margin-right:auto}
  .top{padding:0 0 24px;border-bottom:1px solid var(--line);margin-bottom:26px}
  .top h1{font-size:22px;letter-spacing:-.03em}
  .view{gap:20px;min-width:0}
  .card{border-radius:12px;padding:24px}
  .btn{border-radius:8px;padding:9px 14px;font-size:14px;transition:background .15s,border-color .15s}
  .btn:hover:not(:disabled){background:var(--soft);border-color:var(--grid)}
  .btn.pri:hover:not(:disabled){background:color-mix(in srgb,var(--accent) 88%,black)}
  .big{border-radius:9px;padding:13px 22px;font-size:16px;letter-spacing:0;box-shadow:none;transition:background .15s}
  .big:active{transform:none;box-shadow:none}
  .big:hover{background:color-mix(in srgb,var(--accent) 88%,black)}
  .tabs{left:0;right:auto;top:0;bottom:0;box-sizing:border-box;width:var(--side-width);padding:24px 16px 16px;border-top:0;border-left:0;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-start;gap:20px;overflow-y:auto;overscroll-behavior:contain}
  .side-brand{display:flex;align-items:center;gap:10px;padding:0 10px 2px;font-weight:750;font-size:16px}
  .side-brand .mark{width:32px;height:32px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);border-radius:9px;font-size:17px}
  .side-brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;letter-spacing:.06em}
  .tabs .in{display:flex;flex-direction:column;width:100%;gap:4px;max-width:none}
  .tab{flex:initial;flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 12px;border-radius:8px;font-size:14px;text-align:left}
  .tab .k{font:600 14px var(--f-body);width:25px;height:25px;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center}
  .tab:hover{background:var(--soft)}
  .tab[aria-selected="true"]{background:var(--soft);color:var(--accent)}
  .tab[aria-selected="true"] .k{border-color:var(--accent)}
  .side-context{display:flex;flex-direction:column;gap:3px;border-top:1px solid var(--line);padding-top:14px}
  .side-label{padding:8px 12px 6px;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em}
  .side-option{appearance:none;display:flex;align-items:center;gap:8px;justify-content:space-between;width:100%;padding:9px 12px;background:transparent;border:1px solid transparent;border-radius:7px;font:inherit;font-size:12.5px;color:var(--muted);cursor:pointer;text-align:left}
  .side-option:hover{background:var(--soft);color:var(--ink)}
  .side-option[aria-pressed="true"]{background:var(--soft);border-color:var(--line);color:var(--accent);font-weight:700}
  .side-option .count{font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted)}
  .side-option:focus-visible{outline:3px solid var(--needle);outline-offset:2px}
  .side-foot{display:block;padding:16px 12px 0;border-top:1px solid var(--line);font-size:11px;color:var(--muted);margin-top:auto}
  .phrase-actions{flex-direction:row;align-items:center;flex-wrap:wrap;margin:4px 0}

<script>
const DATA = __DATA__;
const SHARE = !!DATA.SHARE; // share edition: no school schedule, self-paced units
// iPhone / iPad (iPadOS reports itself as a Mac with touch): speaking practice is left out there
const NAV = typeof navigator==="object"?navigator:{};
const IOS = /iPhone|iPad|iPod/.test(NAV.userAgent||"")||(NAV.platform==="MacIntel"&&NAV.maxTouchPoints>1);
const SPEAK_ON = !(SHARE&&IOS);
const WORDS = DATA.W.map(w=>({no:w[0],u:w[1],l:w[2],w:w[3],r:w[4],src:w[5],zh:w[6],date:DATA.S[w[1]+'-'+w[2]]||null}));
const BYNO = Object.fromEntries(WORDS.map(w=>[w.no,w]));
const LESSONS = DATA.LESSONS||{};
const EXAMS = DATA.EXAMS||[];
const PHRASES = DATA.P;
const SCENES = DATA.SCENES;
const AUDIO_TOTAL = 2 * (WORDS.length + PHRASES.length);
const INTERVALS=[0,1,2,4,7,15,30];

/* ---------- state ---------- */
const THEME_DEF={preset:"matcha",h:151,s:44,img:false,auto:true,blur:14,glass:72,bgBlur:0};
const DEF = {v:1,settings:{name:"",wg:20,pg:5,mode:"kb",voice:"local",speechVoice:"gsv:mutsumi",slow:false,autoplay:true,tMeaning:true,tReading:true,tKanji:true,spkShowT:true,theme:THEME_DEF,pace:{u:1,l:1}},days:{},srs:{},seenP:{},custom:[],mean:{},events:[],rv:{},speak:{},hwT:{}};
if(SHARE)DEF.settings.voice="ai";
let S = JSON.parse(JSON.stringify(DEF));
let store = null, docRef = null, saveTimer = null, saving = false, dirty = false, saveState = "本机";
const LSK = "nihongo-cho-v1";
function lsGet(){try{return JSON.parse(localStorage.getItem(LSK)||"null")}catch(e){return null}}
function lsSet(){try{localStorage.setItem(LSK,JSON.stringify(S))}catch(e){}}
function merge(x){ if(!x||typeof x!=="object") return; S = Object.assign(JSON.parse(JSON.stringify(DEF)), x); S.settings = Object.assign({},DEF.settings,x.settings||{}); S.settings.theme = Object.assign({},THEME_DEF,(x.settings||{}).theme||{}); S.settings.pace = Object.assign({u:1,l:1},(x.settings||{}).pace||{}); if(/^sys:/.test(S.settings.speechVoice)||S.settings.voice==="device"){S.settings.speechVoice="gsv:mutsumi";S.settings.voice="local"} }
merge(lsGet());delete S.tpDebug;
function persist(){ lsSet(); dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(flush, 1200); }
window.addEventListener?.("pagehide",()=>{if(dirty&&docRef){clearTimeout(saveTimer);flush()}});
async function flush(){
  if(!docRef || saving || !dirty) return;
  saving = true; dirty = false;
  try{ await docRef.set({state: JSON.stringify(S), at: Date.now()}); saveState = docRef.local?"已保存":"已同步"; }
  catch(e){ saveState = "暂存本机"; dirty = true; }
  saving = false; if(dirty) saveTimer = setTimeout(flush, 3000);
  const el=document.getElementById("saveState"); if(el) el.textContent=saveState;
}
// On the local desktop server, records live in a file (.runtime/study-state.json) so the Mac app
// and any browser window share the same progress. Same get/set shape as the Artifact db doc.
async function desktopDoc(){
  if(SHARE||window.claude||!/^https?:$/.test(location.protocol))return null;
  try{const h=await fetch("/api/health",{cache:"no-store"}).then(r=>r.ok?r.json():null);if(!h?.desktop)return null}catch(e){return null}
  return {local:true,
    async get(){const r=await fetch("/api/state",{cache:"no-store"});if(!r.ok)throw Error("读取失败");const v=await r.json();return {exists:!!v.exists&&!v.error,data:()=>v}},
    async set(v){const r=await fetch("/api/state",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(v),keepalive:JSON.stringify(v).length<60000});if(!r.ok)throw Error("保存失败")}
  };
}
async function boot(){
  aiStatus();
  try{
    const [db,user] = await Promise.all([window.claude?.use?.("db"), window.claude?.use?.("user")]);
    const local = !(db&&user) && await desktopDoc();
    if(local || (db && user)){
      const id = local? "desktop" : await user.id();
      if(id){
        docRef = local || db.collection("data/users/"+id).doc("state");
        const snap = await docRef.get();
        if(snap.exists){
          const remote = JSON.parse(snap.data().state||"null");
          const local = lsGet();
          // keep whichever has more study records
          const cnt = o=>o?Object.keys(o.days||{}).length*1000+Object.keys(o.srs||{}).length:0;
          if(cnt(remote)>=cnt(local)) merge(remote); else { dirty=true; }
          if(S.tpDebug){delete S.tpDebug;dirty=true}
          lsSet();
        } else { dirty = true; }
        saveState=local?"已保存":"已同步"; flush(); applyTheme(); render();
      }
    }
  }catch(e){ saveState="暂存本机"; }
}

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const WK="日月火水木金土";
const today=()=>ymd(new Date());
const isWeekend=s=>{const g=parse(s).getDay();return g===0||g===6};
function weekRange(s){const g=parse(s).getDay();const mon=addDays(s,-((g+6)%7));return [mon,addDays(mon,4)]}
function dayRec(s){return S.days[s]||(S.days[s]={w:0,p:0,ok:0})}
function met(s){const d=S.days[s];return !!d && d.w>=S.settings.wg && d.p>=S.settings.pg}
function studied(s){const d=S.days[s];return !!d&&(d.w+d.p)>0}

/* ---------- word pools ---------- */
// Share edition: progress is a chosen unit/lesson instead of school dates.
const lkey=(u,l)=>u*100+l;
const LESSON_KEYS=[...new Set(WORDS.map(w=>lkey(w.u,w.l)))].sort((a,b)=>a-b);
const paceKey=()=>lkey(S.settings.pace.u,S.settings.pace.l);
function unlocked(w,t=today()){return SHARE?lkey(w.u,w.l)<=paceKey():!!w.date&&w.date<=t}
function advancePace(){ // current lesson fully started → move on to the next one
  while(WORDS.filter(w=>lkey(w.u,w.l)===paceKey()).every(w=>S.srs[w.no])){
    const nx=LESSON_KEYS.find(k=>k>paceKey());if(!nx)return;S.settings.pace={u:Math.floor(nx/100),l:nx%100};persist()}
}
function pool(t=today()){return WORDS.filter(w=>unlocked(w,t))}
function newToday(t=today()){return SHARE?WORDS.filter(w=>lkey(w.u,w.l)===paceKey()):WORDS.filter(w=>w.date===t)}
// a word answered right today is not tested again today (wrong ones come back the same day)
function due(t=today()){return pool(t).filter(w=>{const s=S.srs[w.no];return !s? (SHARE?lkey(w.u,w.l)<paceKey():w.date<t) : s.due<=t&&s.okDay!==t})}
function buildQueue(){
  const t=today(), q=[], seen=new Set();
  const push=(w,isNew)=>{if(!seen.has(w.no)){seen.add(w.no);q.push({w,isNew})}};
  if(SHARE)advancePace();
  if(!SHARE&&isWeekend(t)){
    const [a,b]=weekRange(t);
    WORDS.filter(w=>w.date&&w.date>=a&&w.date<=b).filter(w=>{const s=S.srs[w.no];return !s||s.last!==t}).forEach(w=>push(w,!S.srs[w.no]));
  } else {
    newToday(t).filter(w=>!S.srs[w.no]).forEach(w=>push(w,true));
  }
  due(t).sort((x,y)=>(y.date||"").localeCompare(x.date||"")).forEach(w=>push(w,!S.srs[w.no]));
  return q.slice(0,GROUP);
}
// 5 per group: working memory holds about 4±1 chunks (Cowan 2001), so one group = one "chunk set".
// Flow: learn all 5 → test all 5 (no per-word result screen) → checklist with animated ticks.
const GROUP=5;
function grade(w,ok){
  const t=today(),prev=S.srs[w.no]?{...S.srs[w.no]}:null; const s=S.srs[w.no]||{b:0,due:t};
  s.b = ok? Math.min(s.b+1,INTERVALS.length-1) : 0;
  s.due = addDays(t, ok? INTERVALS[s.b] : 0); s.last=t; if(ok)s.okDay=t; else delete s.okDay;
  S.srs[w.no]=s; const d=dayRec(t); d.w++; if(ok) d.ok++; persist();
  return {day:t,prev,ok}; // lets "上一题" take the grade back
}
function ungrade(w,g){
  if(g.prev)S.srs[w.no]=g.prev;else delete S.srs[w.no];
  const d=dayRec(g.day);d.w=Math.max(0,d.w-1);if(g.ok)d.ok=Math.max(0,d.ok-1);persist();
}

/* ---------- text checks ---------- */
const kata2hira=s=>s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
function core(s){return s.replace(/（[^）]*）|\([^)]*\)/g,"").replace(/[・～〜\s　]/g,"").replace(/する$/,"")}
function norm(s){return kata2hira(core(s)).toLowerCase()}
function normSent(s){return kata2hira(s).replace(/[\s　、。,.!！?？「」『』…・〜～]/g,"")}
function lcsDiff(a,b){ // a = user, b = target ; returns ops
  const n=a.length,m=b.length,dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const out=[];let i=0,j=0;
  while(i<n||j<m){
    if(i<n&&j<m&&a[i]===b[j]){out.push(["o",b[j]]);i++;j++}
    else if(j<m&&(i>=n||dp[i][j+1]>=dp[i+1][j])){out.push(["m",b[j]]);j++}
    else {out.push(["x",a[i]]);i++}
  }
  return out;
}
function diffHTML(user,target,cls=""){
  return `<div class="diff ${cls}">`+lcsDiff([...user],[...target]).map(([k,c])=>`<span class="${k}">${esc(c)}</span>`).join("")+`</div>`;
}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function meaningOf(w){return w.zh||S.mean[w.no]||""}
function hasKanji(s){return /[一-鿿々]/.test(s)}

/* ---------- speech v3: local engines, portable assets and explicit fallback ---------- */
const AUD={},AUDP={};
const speechInfo={voices:[],manifest:null,desktop:false};
let curAudio=null,curObjectURL=null,speechAbort=null,speechSerial=0,speechFinish=null,speechRate=1,speechStartHook=null;
const fireSpeechStart=()=>{const h=speechStartHook;speechStartHook=null;h?.()};
function speechStatus(message){document.querySelectorAll('[data-speech-status]').forEach(e=>e.textContent=message)}
function stopSpeech(){
  speechSerial++;if(speechAbort)speechAbort.abort();speechAbort=null;
  if(curAudio){curAudio.pause();curAudio.src="";curAudio=null}
  if(speechFinish){speechFinish();speechFinish=null}
  if(curObjectURL){URL.revokeObjectURL(curObjectURL);curObjectURL=null}
  if(window.speechSynthesis)window.speechSynthesis.cancel();
}
async function speechJSON(path,body,signal){
  const r=await fetch(path,{method:body===undefined?"GET":"POST",headers:body===undefined?{}:{"Content-Type":"application/json"},body:body===undefined?undefined:JSON.stringify(body),signal});
  let data;try{data=await r.json()}catch(e){throw Error("请用「启动学习APP」打开电脑版本")}
  if(!r.ok)throw Error(data.error||"本地发音服务暂不可用");return data;
}
async function portableManifest(){
  if(speechInfo.manifest)return speechInfo.manifest;
  try{const r=await fetch("audio-v3/manifest.json",{cache:"no-store"});if(r.ok)speechInfo.manifest=await r.json()}catch(e){}
  return speechInfo.manifest||{voices:{}};
}
function loadPack(name){return AUDP[name]||(AUDP[name]=fetch("audio/"+name+".json").then(r=>{if(!r.ok)throw Error("旧版音频包未加载");return r.json()}).then(m=>Object.assign(AUD,Object.fromEntries(Object.entries(m).map(([k,v])=>[(name.startsWith("u")?"w":"")+k,v])))).catch(e=>{AUDP[name]=null;throw e}))}
async function playAudioSource(source,serial){
  if(serial!==speechSerial)return;
  const audio=new Audio(source);curAudio=audio;audio.preservesPitch=true;audio.playbackRate=speechRate;
  const ended=new Promise((resolve,reject)=>{
    speechFinish=resolve;audio.onended=resolve;audio.onerror=()=>reject(Error("音频播放失败，请重试"));
  });
  // Register rejection handling before play() can fail.
  const done=ended.catch(e=>{throw e});done.catch(()=>{});
  try{await audio.play();fireSpeechStart();await done}finally{
    if(curAudio===audio){curAudio=null;speechFinish=null}
    if(source.startsWith("blob:")){URL.revokeObjectURL(source);if(curObjectURL===source)curObjectURL=null}
  }
}
async function speakDevice(txt,slow,serial){
  if(!window.speechSynthesis)throw Error("这个环境不能朗读");
  const u=new SpeechSynthesisUtterance(txt);u.lang="ja-JP";u.rate=(slow?.75:1)*speechRate;
  const voices=speechSynthesis.getVoices(),want=S.settings.speechVoice?.startsWith("sys:")?S.settings.speechVoice.slice(4):"Kyoko";
  u.voice=voices.find(v=>/^ja/i.test(v.lang)&&v.name.startsWith(want))||voices.find(v=>/^ja[-_]JP$/i.test(v.lang))||voices.find(v=>/^ja/i.test(v.lang))||null;
  u.onstart=fireSpeechStart;
  await new Promise((resolve,reject)=>{speechFinish=resolve;u.onend=resolve;u.onerror=e=>e.error==="canceled"||e.error==="interrupted"?resolve():reject(Error("系统日语语音不可用"));if(serial!==speechSerial)return resolve();speechSynthesis.speak(u)});
}
async function playSpeech(item,{slow=false,repeat=1,device=false,rate=1}={}){
  stopSpeech();const serial=speechSerial;const abort=new AbortController();speechAbort=abort;speechRate=rate;
  try{
    const mode=device||S.settings.speechVoice?.startsWith("sys:")&&S.settings.voice!=="ai"?"device":S.settings.voice;
    for(let i=0;i<repeat;i++){
      if(serial!==speechSerial)return;
      if(mode==="device")await speakDevice(item.text,slow,serial);
      else if(mode==="ai"&&SHARE&&DATA.VOICE&&item.key){
        // share edition: pre-recorded voice files, nothing is synthesized on the device
        await playAudioSource(`voice/${item.key}${slow&&!item.key.startsWith("s")?"-slow":""}.m4a`,serial);
      }
      else if(mode==="ai"){
        if(!item.pack)throw Error("这一句没有教材配音");
        await loadPack(item.pack);
        if(serial!==speechSerial)return;
        const b64=AUD[item.key];if(!b64)throw Error("这一句没有教材配音");
        const bin=atob(b64),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
        curObjectURL=URL.createObjectURL(new Blob([bytes],{type:b64.startsWith("AAAA")?"audio/mp4":"audio/mpeg"}));await playAudioSource(curObjectURL,serial);
      }else{
        const voice=S.settings.speechVoice;
        const manifest=await portableManifest();if(serial!==speechSerial)return;
        const saved=manifest.voices?.[voice],entry=saved?.items?.[item.key+(slow?":slow":":normal")];
        if(entry&&entry.text===item.text&&/^[a-f0-9]{64}\.wav$/.test(entry.file)){
          await playAudioSource("audio-v3/"+entry.file,serial);
        }else{
          const payload={voice,slow};if(item.key&&DATA.T[item.key])payload.key=item.key;else payload.text=item.text;
          const result=await speechJSON("/api/speech",payload,abort.signal);if(serial!==speechSerial)return;
          if(!/^\/api\/audio\/[a-f0-9]{64}\.wav$/.test(result.url))throw Error("发音响应无效");
          await playAudioSource(result.url,serial);
        }
      }
      if(serial!==speechSerial)return;
      if(i<repeat-1)await new Promise(resolve=>setTimeout(resolve,1200));
    }
  }catch(e){if(serial===speechSerial&&e.name!=="AbortError"){fireSpeechStart();toast(e.message)}}
  finally{if(serial===speechSerial)speechAbort=null}
}
function wordSpeech(w){return {key:"w"+w.no,pack:"u"+w.u,text:DATA.T["w"+w.no]||w.r.replace(/[（）()・～〜]/g,"")}}

function voiceName(id,name){if(id?.startsWith("sys:"))return id.slice(4);return String(name||(id==="gsv:mutsumi"?"若叶睦":id)).split(" · ")[0]}
function sysVoices(){const vs=window.speechSynthesis?.getVoices?.()||[];return SYS_VOICES.filter(n=>vs.some(v=>/^ja/i.test(v.lang)&&v.name.startsWith(n)))}

async function fillVoices(select){
  const cur=S.settings.speechVoice,voices=new Map();
  try{const data=await speechJSON("/api/voices");speechInfo.voices=data.voices;for(const v of data.voices)voices.set(v.id,v)}catch(e){}
  const manifest=await portableManifest();
  for(const [id,v]of Object.entries(manifest.voices||{}))if(!voices.get(id)?.ready)voices.set(id,{id,name:v.name,ready:true,offline:true});
  for(const n of sysVoices())voices.set("sys:"+n,{id:"sys:"+n,name:n,ready:true});
  if(!voices.has(cur))voices.set(cur,{id:cur,name:voiceName(cur)});
  if(!select.isConnected)return;
  select.replaceChildren(...[...voices.values()].filter(v=>v.ready!==false||v.id===cur).map(v=>{const o=document.createElement("option");o.value=v.id;o.textContent=voiceName(v.id,v.name);o.selected=v.id===cur;return o}));
}

/* ---------- gauge ---------- */
function gaugeSVG(o){
  // outer scale = today's words (0..goal), inner track = whole word list (806): unlocked vs practiced
  const cx=120,cy=128,R=100,Ri=60,wg=o.wg; let ticks="";
  const step=wg<=20?1:wg<=40?2:5, major=wg/4;
  for(let v=0;v<=wg+1e-9;v+=step){const a=Math.PI*(1-v/wg),isMaj=Math.abs(v/major-Math.round(v/major))<1e-6,r1=R-(isMaj?15:8);
    ticks+=`<line x1="${(cx+R*Math.cos(a)).toFixed(1)}" y1="${(cy-R*Math.sin(a)).toFixed(1)}" x2="${(cx+r1*Math.cos(a)).toFixed(1)}" y2="${(cy-r1*Math.sin(a)).toFixed(1)}" stroke="var(--muted)" stroke-width="${isMaj?2.4:1.1}" stroke-linecap="round"/>`;
    if(isMaj){const rl=R-26;ticks+=`<text x="${(cx+rl*Math.cos(a)).toFixed(1)}" y="${(cy-rl*Math.sin(a)+4).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)" font-family="var(--f-body)">${Math.round(v)}</text>`}}
  const arcP=(r,f)=>{f=Math.max(0,Math.min(1,f));const e=Math.PI*(1-f);return `M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${(cx+r*Math.cos(e)).toFixed(2)} ${(cy-r*Math.sin(e)).toFixed(2)}`};
  const ft=Math.min(1,o.w/wg),fu=o.unlocked/o.total,fp=o.practiced/o.total,fm=o.mastered/o.total;
  return `<svg viewBox="0 0 240 148" role="img" aria-label="今天背了 ${o.w} 个词,目标 ${wg};总词量 ${o.total},已练 ${o.practiced}">
   <path d="${arcP(R,1)}" fill="none" stroke="var(--soft)" stroke-width="10" stroke-linecap="round"/>
   ${ft>0?`<path d="${arcP(R,ft)}" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round"/>`:""}
   ${ticks}
   <path d="${arcP(Ri,1)}" fill="none" stroke="var(--soft)" stroke-width="7"/>
   <path d="${arcP(Ri,fu)}" fill="none" stroke="var(--grid)" stroke-width="7"/>
   ${fp>0?`<path d="${arcP(Ri,fp)}" fill="none" stroke="var(--blue)" stroke-width="7"/>`:""}
   ${fm>0?`<path d="${arcP(Ri,fm)}" fill="none" stroke="var(--ink)" stroke-width="7"/>`:""}
   <text x="${cx-Ri}" y="${cy+14}" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="var(--f-body)">0</text>
   <text x="${cx+Ri}" y="${cy+14}" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="var(--f-body)">${o.total}</text>

const SECTIONS=[
  {key:"meaning",set:"tMeaning",label:"选意思",chip:"看假名选意思"},
  {key:"reading",set:"tReading",label:"假名读音",chip:"写出读音（假名）"},
  {key:"kanji",set:"tKanji",label:"汉字书写",chip:"看假名写汉字"},

const kanjiWord=w=>hasKanji(core(w.w));
function eligible(w,key){
  if(key==="meaning")return !!meaningOf(w);
  if(key==="reading")return kanjiWord(w)||!!meaningOf(w);   // kana-only words: meaning → type kana
  return kanjiWord(w)&&handTarget(w).length>0&&handTarget(w).length<=6;
}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function buildTests(q,types){
  const on=types?SECTIONS.filter(s=>types.includes(s.key)):SECTIONS.filter(s=>S.settings[s.set]!==false);
  let tests=[];for(const s of on)tests.push(...shuffle(q.filter(it=>eligible(it.w,s.key))).map(it=>({w:it.w,type:s.key})));
  if(!tests.length&&!types)tests=q.map(it=>({w:it.w,type:"reading"}));
  return tests;
}
function choicesFor(w){
  const right=meaningOf(w),seen=new Set([right]);
  const pool=shuffle(WORDS.filter(x=>x.no!==w.no&&meaningOf(x)));
  // prefer distractors from the same unit, they are more confusable
  pool.sort((a,b)=>(b.u===w.u)-(a.u===w.u));
  const opts=[right];for(const x of pool){const m=meaningOf(x);if(!seen.has(m)){seen.add(m);opts.push(m)}if(opts.length===4)break}
  return shuffle(opts);

function startGroup(){
  const q=buildQueue();if(!q.length)return false;

// Records one test answer and moves straight on. A word is graded (spaced repetition + today's count)

function answer(w,v,ok,mode,note,hw){

  const r={w,type:t.type,v,ok,mode,note};if(hw&&!ok)r.hw=hw.slice();sess.res.push(r);
  if(--sess.left[w.no]===0&&!sess.review)r.graded=grade(w,sess.res.filter(x=>x.w===w).every(x=>x.ok));

function makeCellPad(cv){

  function size(){W=Math.max(200,Math.min(main.clientWidth-60,440));H=Math.round(W/aspect);
    cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+"px";cv.style.height=H+"px";ctx=cv.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);draw()}

    ctx.strokeStyle=css.getPropertyValue("--grid").trim()||"#9c9";ctx.lineWidth=1;ctx.setLineDash([5,5]);
    ctx.beginPath();ctx.moveTo(W/2,6);ctx.lineTo(W/2,H-6);ctx.moveTo(6,H/2);ctx.lineTo(W-6,H/2);ctx.stroke();ctx.setLineDash([]);

  cv.onpointermove=e=>{if(!cur)return;if(!(e.buttons&1)){cur=null;return}cur.push(pos(e));draw()};
  cv.onpointerup=cv.onpointercancel=()=>{cur=null};

let recogP=null;

function loadRecognizer(){
  return recogP||(recogP=(async()=>{
    if(!window.KanjiCanvas)await loadScript("vendor/kanjicanvas/kanji-canvas.js");
    if(!KanjiCanvas.refPatterns.length)await loadScript("vendor/kanjicanvas/ref-patterns.js");
    // the shipped patterns lack kana: build them from the repo's kana stroke data
    const kana=await fetch("vendor/kanjicanvas/kana-strokes.json").then(r=>{if(!r.ok)throw Error("假名数据缺失");return r.json()});
    const have=new Set(KanjiCanvas.refPatterns.map(p=>p[0]));

function validateRecords(input){
  const value=input?.app==="nihongo-cho"?input.state:input;
  if(!value||value.v!==1||!value.days||!value.srs||!Array.isArray(value.custom))throw Error("这不是有效的学习记录文件");
  const clean=JSON.parse(JSON.stringify(DEF)),obj=x=>x&&typeof x==="object"&&!Array.isArray(x);
  const num=x=>typeof x==="number"&&Number.isFinite(x)&&x>=0&&Number.isInteger(x);
  const date=x=>/^\d{4}-\d{2}-\d{2}$/.test(x)&&!Number.isNaN(Date.parse(x));
  if(!obj(value.days)||!obj(value.srs)||!obj(value.settings))throw Error("学习记录结构无效");
  for(const [key,r]of Object.entries(value.days)){if(!date(key)||!obj(r)||![r.w,r.p,r.ok].every(num))throw Error("每日记录格式无效");clean.days[key]={w:r.w,p:r.p,ok:r.ok}}
  for(const [key,r]of Object.entries(value.srs)){if(!Object.hasOwn(BYNO,key)||!obj(r)||!num(r.b)||r.b>6||!date(r.due)||(r.last&&!date(r.last)))throw Error("复习记录格式无效");clean.srs[key]={b:r.b,due:r.due,...(r.last?{last:r.last}:{}),...(date(r.okDay)?{okDay:r.okDay}:{})}}
  const set=value.settings;clean.settings.name=String(set.name||"").slice(0,20);
  if(num(set.wg)&&set.wg>=1&&set.wg<=200)clean.settings.wg=set.wg;
  if(num(set.pg)&&set.pg<=50)clean.settings.pg=set.pg;
  if(obj(set.theme))clean.settings.theme=cleanTheme(set.theme);
  if(obj(set.pace)&&UNITS.includes(set.pace.u)&&Number.isInteger(set.pace.l)&&set.pace.l>=1&&set.pace.l<=50)clean.settings.pace={u:set.pace.u,l:set.pace.l};
  if(["kb","hand"].includes(set.mode))clean.settings.mode=set.mode;
  for(const k of ["slow","autoplay","tMeaning","tReading","tKanji"])if(typeof set[k]==="boolean")clean.settings[k]=set[k];
  if(["ai","device","local"].includes(set.voice))clean.settings.voice=set.voice;
  if(typeof set.speechVoice==="string"&&/^(gsv:[a-z0-9_-]+|aivis:-?\d+|vv:\d+)$/.test(set.speechVoice))clean.settings.speechVoice=set.speechVoice;
  if(value.custom.length>10000)throw Error("自加短语数量过多");
  const ids=new Set();for(const p of value.custom){if(!obj(p)||!/^c\d+$/.test(p.id)||ids.has(p.id)||![p.jp,p.zh,p.s].every(x=>typeof x==="string"&&x.length>0&&x.length<=2000))throw Error("自加短语格式无效");ids.add(p.id);clean.custom.push({id:p.id,jp:p.jp,zh:p.zh,s:p.s})}
  if(obj(value.seenP))for(const [key,n]of Object.entries(value.seenP)){if(!/^(p\d+|c\d+)$/.test(key)||!num(n))throw Error("短语记录格式无效");clean.seenP[key]=n}
  if(obj(value.mean))for(const [key,meaning]of Object.entries(value.mean)){if(!Object.hasOwn(BYNO,key)||typeof meaning!=="string"||meaning.length>2000)throw Error("词义记录格式无效");clean.mean[key]=meaning}
  cleanExtras(value,clean);
  return clean;
}

function srsLabel(w){const s=S.srs[w.no];if(!s)return unlocked(w)?["待学","new"]:["未学到","lock"];if(s.b>=4)return ["熟练","good"];return [`复习中 · ${s.b}`,"mid"]}

  const ws=unitWords(reviewUnit),last=S.rv[reviewUnit],miss=new Set(last?.miss||[]);

function openReviewModal(u){
  const ws=unitWords(u),missNos=S.rv[u]?.miss||[];
  const m=openModal(`<h2>Unit${u} 自测 · 选择题型</h2>
   <div class="pick">${SECTIONS.map(s=>`<label class="pick-row"><input type="checkbox" data-k="${s.key}" ${S.settings[s.set]!==false?"checked":""}><span><b>${s.label}</b><small>${SDESC[s.key]}</small></span><em data-n="${s.key}"></em></label>`).join("")}</div>
   <label class="pick-row"><input type="checkbox" id="rvMiss" ${missNos.length?"":"disabled"}><span><b>只测上次错的词</b><small>${missNos.length?`上次错了 ${missNos.length} 个`:"还没有自测记录"}</small></span></label>
   <label class="pick-row"><input type="checkbox" id="rvLearn"><span><b>先过一遍单词卡</b></span></label>
   <p class="small muted" id="rvCount" role="status"></p>
   <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-close>取消</button><button class="btn pri" id="rvGo">开始自测</button></div>`,"选择题型");
  const words=()=>m.querySelector("#rvMiss").checked?ws.filter(w=>missNos.includes(w.no)):ws;
  const types=()=>[...m.querySelectorAll("[data-k]")].filter(c=>c.checked).map(c=>c.dataset.k);
  const upd=()=>{const W=words();let total=0;
    for(const s of SECTIONS){const n=W.filter(w=>eligible(w,s.key)).length;m.querySelector(`[data-n="${s.key}"]`).textContent=n+" 题";if(types().includes(s.key))total+=n}
    m.querySelector("#rvCount").textContent=types().length?`共 ${W.length} 个词 · ${total} 道题`:"至少选一种题型";m.querySelector("#rvGo").disabled=!total};
  m.querySelectorAll("input").forEach(c=>c.onchange=upd);upd();
  m.querySelector("#rvGo").onclick=()=>{const ty=types(),W=words(),learn=m.querySelector("#rvLearn").checked;if(startReview(u,W,ty,learn))closeModal()};
}
function startReview(u,words,types,learn){
  const q=shuffle(words).map(w=>({w,isNew:false}));
  const tests=buildTests(q,types);if(!tests.length){toast("这些词没有可以出的题");return false}
  const left={};tests.forEach(t=>left[t.w.no]=(left[t.w.no]||0)+1);
  sess={q:q.filter(it=>left[it.w.no]),tests,left,i:0,phase:learn?"learn":"test",res:[],animated:false,review:{u,types}};
  tab="words";sub="study";render();window.scrollTo(0,0);return true;
}
function saveReview(){
  const rv=sess.review,words=sess.q.map(it=>it.w),wrong=words.filter(w=>!sess.res.filter(r=>r.w===w).every(r=>r.ok));
  S.rv[rv.u]={d:today(),ok:words.length-wrong.length,n:words.length,miss:wrong.map(w=>w.no)};persist();
}

const BGK="nihongo-cho-bg";
function bgData(){try{return localStorage.getItem(BGK)||""}catch(e){return ""}}
function hsl2hex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));
  return "#"+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,"0")).join("")}
function relLum(hex){const c=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255).map(v=>v<=.03928?v/12.92:((v+.055)/1.055)**2.4);return .2126*c[0]+.7152*c[1]+.0722*c[2]}
const contrast=(a,b)=>{const x=relLum(a),y=relLum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
function themeVars(h,s){
  const ws=Math.min(s,30),c=(S2,L)=>hsl2hex(h,S2,L);
  let la=46;while(la>18&&contrast(c(s,la),"#ffffff")<4.6)la--;
  const dPaper=c(ws*.45,12);let da=52;while(da<88&&contrast(c(s,da),dPaper)<5.5)da++;
  const light={bg:c(ws*.6,96),paper:c(ws,99),ink:c(ws*.6,17),muted:c(ws*.3,43),line:c(ws*.7,86),grid:c(ws*.9,77),soft:c(ws*.8,92),accent:c(s,la),"accent-ink":"#ffffff"};
  const dark={bg:c(ws*.45,9),paper:dPaper,ink:c(ws*.5,91),muted:c(ws*.3,64),line:c(ws*.5,20),grid:c(ws*.7,27),soft:c(ws*.55,16),accent:c(s,da),"accent-ink":c(ws*.6,9)};
  const css=o=>Object.entries(o).map(([k,v])=>`--${k}:${v}`).join(";");
  // html:root outranks the page's own :root palette whatever the stylesheet order
  return `html:root{${css(light)}}@media (prefers-color-scheme: dark){html:root:not([data-theme="light"]){${css(dark)}}}html:root[data-theme="dark"]{${css(dark)}}`;
}
function applyTheme(){
  if(!document.body?.classList||!document.head?.append)return;
  const th=S.settings.theme;let st=document.getElementById("themeVars");
  if(!st){st=document.createElement("style");st.id="themeVars";document.head.append(st)}
  st.textContent=(th.h===THEME_DEF.h&&th.s===THEME_DEF.s)?"":themeVars(th.h,th.s);
  let layer=document.getElementById("bgLayer");
  if(!layer){layer=document.createElement("div");layer.id="bgLayer";layer.setAttribute("aria-hidden","true");document.body.prepend(layer)}
  const img=th.img?bgData():"";
  layer.style.backgroundImage=img?`url("${img}")`:"";
  document.body.classList.toggle("has-bg",!!img);
  const r=document.documentElement.style;r.setProperty("--glass",th.glass+"%");r.setProperty("--blur",Math.round(th.glass/100*24)+"px");r.setProperty("--bgblur",th.bgBlur+"px");

// Pick an accent from a picture: the most common clearly-coloured hue, weighted by saturation.
function imageAccent(img){
  const c=document.createElement("canvas");c.width=c.height=56;const x=c.getContext("2d");x.drawImage(img,0,0,56,56);
  const d=x.getImageData(0,0,56,56).data,bins=Array.from({length:36},()=>({w:0,sx:0,sy:0,s:0}));let tot=0;
  for(let i=0;i<d.length;i+=4){const r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,dl=mx-mn;
    if(dl<.06)continue;const s=dl/(1-Math.abs(2*l-1));let h=mx===r?((g-b)/dl)%6:mx===g?(b-r)/dl+2:(r-g)/dl+4;h=(h*60+360)%360;
    const w=s*(1-Math.abs(l-.5)*1.6);if(w<=0)continue;const bn=bins[Math.floor(h/10)];bn.w+=w;bn.sx+=Math.cos(h*Math.PI/180)*w;bn.sy+=Math.sin(h*Math.PI/180)*w;bn.s+=s*w;tot+=w}
  const best=bins.reduce((a,b)=>b.w>a.w?b:a);
  if(!tot||best.w<tot*.04)return {h:210,s:10};
  return {h:Math.round((Math.atan2(best.sy,best.sx)*180/Math.PI+360)%360),s:Math.round(Math.max(30,Math.min(75,best.s/best.w*80)))};
}
function loadImage(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(Error("图片读不出来"));i.src=src})}
async function setBackground(file){
  if(!file)return;if(!/^image\//.test(file.type)){toast("请选择图片文件");return}
  const url=URL.createObjectURL(file);
  try{const img=await loadImage(url),k=Math.min(1,1920/Math.max(img.width,img.height)),c=document.createElement("canvas");
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    let q=.84,data=c.toDataURL("image/jpeg",q);while(data.length>2.6e6&&q>.4){q-=.12;data=c.toDataURL("image/jpeg",q)}
    try{localStorage.setItem(BGK,data)}catch(e){toast("图片太大，存不下，换一张小一点的");return}
    const th=S.settings.theme;th.img=true;
    if(th.auto){const a=imageAccent(img);th.h=a.h;th.s=a.s;th.preset="custom"}
    persist();applyTheme();render();toast(th.auto?"已换背景，并按图片配好主题色":"已换背景");
  }catch(e){toast(e.message||"图片处理失败")}finally{URL.revokeObjectURL(url)}
}

function cleanTheme(t){

  return {preset:typeof t.preset==="string"&&(t.preset==="custom"||THEMES.some(x=>x.id===t.preset))?t.preset:THEME_DEF.preset,
    h:n(t.h,0,359,THEME_DEF.h),s:n(t.s,0,100,THEME_DEF.s),img:t.img===true,auto:t.auto!==false,
    blur:n(t.blur,0,40,THEME_DEF.blur),glass:n(t.glass,10,100,THEME_DEF.glass),bgBlur:n(t.bgBlur,0,30,THEME_DEF.bgBlur)};

function cleanExtras(value,clean){
  const obj=x=>x&&typeof x==="object"&&!Array.isArray(x),date=x=>typeof x==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(x);
  const int=(x,a,b)=>Number.isInteger(x)&&x>=a&&x<=b;
  if(typeof value.settings?.spkShowT==="boolean")clean.settings.spkShowT=value.settings.spkShowT;
  if(Array.isArray(value.events))for(const e of value.events.slice(0,500))
    if(obj(e)&&/^e\d+$/.test(e.id)&&date(e.d)&&typeof e.title==="string"&&e.title.trim()&&e.title.length<=60&&EVKINDS[e.kind])clean.events.push({id:e.id,d:e.d,title:e.title,kind:e.kind});
  if(obj(value.rv))for(const [u,r]of Object.entries(value.rv))
    if(UNITS.includes(+u)&&obj(r)&&date(r.d)&&int(r.ok,0,2000)&&int(r.n,0,2000)&&Array.isArray(r.miss))clean.rv[u]={d:r.d,ok:r.ok,n:r.n,miss:r.miss.filter(x=>Object.hasOwn(BYNO,x)).slice(0,2000)};
  if(obj(value.speak))for(const [id,r]of Object.entries(value.speak))
    if(/^[a-z0-9]{1,20}$/.test(id)&&obj(r)&&int(r.best,0,100)&&int(r.n,0,100000)&&date(r.at))clean.speak[id]={best:r.best,n:r.n,at:r.at,...(int(r.last,0,100)?{last:r.last}:{})};
}

/* ---------- task log: calendar of lessons, tests and your own tasks ---------- */
const EVKINDS={exam:"考试",task:"作业",other:"其他"};
let calMonth=null,calSel=null;
function allEvents(){
  const ev=EXAMS.map(([d,title])=>({d,title,kind:"exam",fixed:true}));
  for(const [d,l]of Object.entries(LESSONS))for(const m of l.matchAll(/Unit\d+テスト/g))if(!ev.some(e=>e.d===d&&e.title.includes(m[0])))ev.push({d,title:m[0],kind:"exam",fixed:true});
  for(const e of S.events)ev.push({...e,fixed:false});
  return ev.sort((a,b)=>a.d.localeCompare(b.d)||a.title.localeCompare(b.title));
}
const isSpeakingExam=e=>/会話|面談|口语|口語|スピーチ|面接/.test(e.title);
const mdw=d=>{const x=parse(d);return `${x.getMonth()+1}/${x.getDate()}（${WK[x.getDay()]}）`};
const countdown=k=>k===0?"就是今天":k===1?"明天":`还有 ${k} 天`;
function speakProgress(){const done=SPEAK.filter(d=>S.speak[d.id]).length,good=SPEAK.filter(d=>(S.speak[d.id]?.best||0)>=80).length;return {done,good,total:SPEAK.length}}
function urgentCard(t){
  const ex=allEvents().filter(e=>e.kind==="exam"&&e.d>=t)[0];if(!ex)return "";

/* ---------- speaking practice: scripted 先生と面談 dialogues, local voice for the teacher,

const T=(jp,zh)=>({s:"t",jp,zh}),ME=(zh,a,kw,g)=>({s:"me",zh,a,kw,g});

function startSpeak(id){

async function speakStep(){
  const run=spk;
  while(spk===run&&spk.i<spk.turns.length&&spk.turns[spk.i].s==="t"){
    const k=spk.i;(spk.shown||(spk.shown={}))[k]=false;spk.talking=true;renderSpeakRun();
    let timer=null;const reveal=()=>{clearTimeout(timer);if(spk!==run||spk.shown[k])return;spk.shown[k]=true;renderSpeakRun()};
    speechStartHook=()=>{timer=setTimeout(reveal,1000)};
    await speakTeacher(spk.turns[k].jp);
    speechStartHook=null;reveal();

    spk.talking=false;await sleep(300);if(spk!==run)return;spk.i++;

function evalTurn(turn,text){

const turnScore=r=>r?(r.kwOk?60:0)+Math.round(r.sim*.4):0;

// Share edition has no local server: the browser's own Japanese speech recognition is used instead.
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

function srStart(){

  r.lang="ja-JP";r.interimResults=false;r.continuous=true;r.maxAlternatives=1;
  r.onresult=e=>{text=[...e.results].map(x=>x[0].transcript).join("")};

async function recStart(){

  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast("无法录音，可以打字回答");return}

  const type=["audio/mp4","audio/webm;codecs=opus","audio/webm"].find(t=>MediaRecorder.isTypeSupported?.(t))||"";
  REC.mr=new MediaRecorder(REC.stream,type?{mimeType:type}:undefined);REC.chunks=[];

  clearInterval(REC.timer);REC.timer=setInterval(()=>{const el=document.getElementById("recT");if(el)el.textContent=((Date.now()-REC.t0)/1000).toFixed(1)+" 秒";if(Date.now()-REC.t0>30000)recStop()},200);

  mr.onstop=async()=>{

    const blob=new Blob(REC.chunks,{type:mr.mimeType||"audio/mp4"});
    if(spk!==run)return;spk.recording=false;
    if(blob.size<1500||Date.now()-REC.t0<500){toast("太短了，再说一次");renderSpeakRun();return}
    spk.busy=true;renderSpeakRun();
    try{
      const r=await fetch("/api/asr",{method:"POST",headers:{"Content-Type":(blob.type||"audio/mp4").split(";")[0],"X-Prompt":encodeURIComponent("日本語の面談の会話です。")},body:blob});

  chat.querySelectorAll("[data-model]").forEach(b=>b.onclick=()=>speakTeacher(spk.turns[+b.dataset.model].a));
  chat.querySelectorAll("[data-fixed]").forEach(b=>b.onclick=()=>speakTeacher(b.dataset.fixed));
  chat.querySelectorAll("[data-mine]").forEach(b=>b.onclick=()=>{stopSpeech();const a=new Audio(spk.res[+b.dataset.mine].audio);curAudio=a;a.play()});
  chat.querySelectorAll("[data-hint]").forEach(b=>b.onclick=()=>{(spk.showHint||(spk.showHint={}))[+b.dataset.hint]=true;renderSpeakRun()});
  chat.querySelectorAll("[data-reveal]").forEach(b=>b.onclick=()=>{(spk.revealT||(spk.revealT={}))[+b.dataset.reveal]=true;renderSpeakRun()});
}
document.addEventListener?.("keydown",e=>{
  if(tab!=="tasks"||sub!=="speakRun"||!spk||document.getElementById("modal")||/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName||""))return;
  const x=spk.turns[spk.i];if(!x||x.s!=="me"||e.metaKey||e.ctrlKey)return;
  if(e.key===" "&&canRecord()){e.preventDefault();if(!e.repeat&&!spk.busy)spk.recording?recStop():recStart()}
  else if(e.key==="Enter"&&spk.res[spk.i]){e.preventDefault();speakNext()}
});
function renderSpeakPop(){
  const p=document.getElementById("pop"),st=S.settings,rate=st.spkRate||1;
  p.innerHTML=`<h3>对话</h3>
    <label class="opt"><span>显示老师说的话</span><input type="checkbox" class="sw" id="kShow" ${st.spkShowT!==false?"checked":""}></label>
    <label class="l" for="kRate">语速 <b id="kRateV">${rate.toFixed(1)}×</b></label>
    <input type="range" id="kRate" min="0.5" max="1.5" step="0.1" value="${rate}">
    ${SHARE?"":"<h3>音色</h3>"}
    <select id="kVoice" ${SHARE?"hidden":""}><option>${esc(voiceName(st.speechVoice))}</option></select>
    <div class="row"><button class="btn ghost small" id="kTry">试听</button></div>`;
  p.querySelector("#kShow").onchange=e=>{st.spkShowT=e.target.checked;persist();if(sub==="speakRun")renderSpeakRun()};
  p.querySelector("#kRate").oninput=e=>{st.spkRate=Math.round(+e.target.value*10)/10;p.querySelector("#kRateV").textContent=st.spkRate.toFixed(1)+"×";persist()};
  const vs=p.querySelector("#kVoice");fillVoices(vs);vs.onchange=()=>{st.speechVoice=vs.value;if(st.voice==="ai"||st.voice==="device")st.voice="local";persist()};
  p.querySelector("#kTry").onclick=()=>speakTeacher("こんにちは。今日はよろしくお願いします。");
}
function renderSpeakList(){
  const t=today(),ex=allEvents().filter(e=>e.d>=t&&isSpeakingExam(e))[0],p=speakProgress();
  main.innerHTML=`<div class="row" style="justify-content:space-between"><button class="btn ghost" id="slBack">← 任务日志</button><div class="row" style="gap:10px"><span class="small muted">已练 ${p.done}/${p.total} 段</span>${gearBtn("对话设置")}</div></div>
   <section class="card" style="display:flex;flex-direction:column;gap:10px">
     ${ex?`<div class="row" style="justify-content:space-between"><span class="chip warn">${mdw(ex.d)} · ${countdown(diffDays(t,ex.d))}</span><span class="small muted" lang="ja">${esc(ex.title)}</span></div>`:""}
     <h2 style="font-size:19px">口语练习 · 先生と面談する</h2>
     <div class="row"><button class="big" id="slMock" style="flex:1">模拟面谈 · 随机 6 问</button></div>
   </section>
   <div class="sp-list">${SPEAK.map((d,k)=>{const r=S.speak[d.id],gs=[...new Set(d.turns.filter(x=>x.s==="me").map(x=>x.g))];
     return `<section class="card sp-item"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><span class="small muted">${k+1}</span> <b style="font-size:16px">${esc(d.title)}</b><div class="small muted">${esc(d.can)}</div></div>
       ${r?`<span class="chip ${r.best>=80?"ok":""}">最好 ${r.best} 分 · 练了 ${r.n} 次</span>`:`<span class="chip">还没练</span>`}</div>
       <div class="tags" lang="ja">${gs.map(g=>`<span class="tag">${esc(g)}</span>`).join("")}</div>
       <button class="btn pri small" data-sp="${d.id}" style="align-self:flex-start">开始练习</button></section>`}).join("")}</div>`;
  document.getElementById("slBack").onclick=()=>{sub="home";render()};
  document.getElementById("slMock").onclick=startMock;
  main.querySelectorAll("[data-sp]").forEach(b=>b.onclick=()=>startSpeak(b.dataset.sp));
}

if(SHARE&&location.protocol==="https:"&&NAV.serviceWorker)NAV.serviceWorker.register("sw.js").catch(()=>{});
applyTheme();
render();
setTimeout(boot,0);
</script>
