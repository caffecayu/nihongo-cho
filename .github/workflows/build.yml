# Builds the Windows installer and the Android APK from docs/ and attaches them to the release of the pushed tag.
name: build-apps
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      # only the Tauri CLI is needed here; skipping install scripts avoids sharp's libvips download (Android icons only)
      - run: npm install --ignore-scripts
      - run: npx tauri icon assets/icon.png
      - run: npx tauri build
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/Nihongo-Cho-windows-setup.exe
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: out/* }
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: out/* }
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # sharp (used by @capacitor/assets for icons) downloads libvips from GitHub, which sometimes times out
      - run: npm install || (sleep 30 && npm install) || (sleep 90 && npm install)
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug --no-daemon
      - run: mkdir -p out && cp android/app/build/outputs/apk/debug/app-debug.apk out/Nihongo-Cho-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/* }
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: out/* }
